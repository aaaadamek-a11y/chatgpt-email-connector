name: Build Windows EXE installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for offline tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python and installer scripts
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          $paths = @('windows-easy-setup.ps1','windows-smtp-setup.ps1','windows-setup.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $path : $($errors | Out-String)" }
          }
          if (Select-String -Path 'windows-easy-setup.ps1' -Pattern '(?i)\$host\b') {
            throw 'Reserved PowerShell $Host variable must not be shadowed.'
          }

      - name: Download offline Windows dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/wheelhouse | Out-Null
          python -m pip download --only-binary=:all: --dest installer/wheelhouse -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download Windows dependency wheels' }
          if (-not (Get-ChildItem installer/wheelhouse -Filter '*.whl')) { throw 'Wheelhouse is empty' }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile one EXE installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler 'installer\webglobe.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $exe = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 100000) { throw 'EXE artifact was not produced' }
          Write-Host "Compiled $($exe.Name) ($($exe.Length) bytes)"

      - name: Silent installation smoke test
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'WebglobeInstallerSmoke'
          $process = Start-Process -FilePath $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target") -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)" }
          foreach ($file in @('NASTAVIT.cmd','windows-easy-setup.ps1','smtp_server.py','draft_store.py','NOTICE','LICENSE')) {
            if (-not (Test-Path (Join-Path $target $file))) { throw "Installed file missing: $file" }
          }
          Write-Host 'Silent install smoke test passed (mailbox credentials NOT used).'
          # Prove the packaged wheels work WITHOUT internet during installation.
          $offlinePython = Join-Path $env:RUNNER_TEMP 'webglobe-offline-test-venv'
          python -m venv $offlinePython
          $venvPython = Join-Path $offlinePython 'Scripts\python.exe'
          & $venvPython -m pip install --no-index --find-links (Join-Path $target 'wheelhouse') -r (Join-Path $target 'requirements.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Offline keyring wheel installation failed' }
          & $venvPython -c 'import keyring; import keyring.backends.Windows'
          if ($LASTEXITCODE -ne 0) { throw 'Offline keyring import failed' }
          Write-Host 'Offline dependencies verified without PyPI network access.'
          # End-to-end packaging smoke test under the installed Windows tree,
          # using only tool definitions and no mailbox credentials.
          & $venvPython (Join-Path $target 'smtp_package_local.py')
          if ($LASTEXITCODE -ne 0) { throw 'Local MCP plugin export failed' }
          $package = Join-Path $target 'Pridat-do-aplikacie\Webglobe-pridat-doplnok.zip'
          if (-not (Test-Path $package)) { throw 'Local MCP plugin ZIP was not created' }
          & $venvPython -c "import zipfile,json,sys;z=zipfile.ZipFile(sys.argv[1]); assert set(z.namelist())=={'plugin.json','mcp.json'}; assert json.loads(z.read('plugin.json'))['version']=='0.9.1'" $package
          if ($LASTEXITCODE -ne 0) { throw 'Local MCP plugin ZIP contents invalid' }
          Write-Host 'Windows plugin export and ZIP validation passed.'


      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: Webglobe-Mail-Connector-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release from version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1).FullName
          gh release create $env:GITHUB_REF_NAME $exe --title "Webglobe Mail Connector $env:GITHUB_REF_NAME" --notes "Single-file Windows installer. Initial setup may download uv, Python and keyring. SMTP is selected for new setups but not enabled until credentials are verified; every send requires explicit confirmation. No email deletion. Original author: Mgr. Peter Adámek | AI konzultant — https://ai-konzultant.sk/. Windows SmartScreen may warn because the installer is not code-signed."

      - name: Publish tested installer as pre-release on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Do not allow an old concurrent run to overwrite a newer release.
          $latestHead = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq '.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current main commit' }
          if ($latestHead.Trim() -ne $env:GITHUB_SHA) {
            Write-Host "A newer commit is available; skipping release publication."
            exit 0
          }
          $version = 'v0.9.1'
          $exe = (Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1).FullName
          $notes = "Single-file unsigned Windows installer fixes local plugin ZIP export errors and WinError 448 by launching the mail setup only after Inno Setup exits, while keeping RedirectionGuard enabled. Offline keyring wheels included. Source commit: $env:GITHUB_SHA. Keyring is reused when already installed; failed dependency setup records diagnostic logs. New setups select SMTP by default but require verified credentials before enabling, and every send requires user confirmation. IMAP Drafts saving is supported without SMTP delivery; no email deletion is supported. Windows GUI and live Webglobe connection still require user testing. Original author: Mgr. Peter Adámek | AI konzultant — https://ai-konzultant.sk/."
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version $exe --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Unable to refresh installer EXE asset' }
            gh release edit $version --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Unable to update release notes' }
          } else {
            gh release create $version $exe --target $env:GITHUB_SHA --prerelease --title "Webglobe Mail Connector $version (Windows installer preview)" --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'GitHub pre-release creation failed' }
          }
